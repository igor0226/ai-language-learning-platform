apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  # One API process migrates before serving; avoid overlapping processors on this dev node.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: {{ include "backend.image" . | quote }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            {{- include "backend.livekitCredentials" . | nindent 12 }}
            {{- include "backend.sharedCredentials" . | nindent 12 }}
            {{- range $key := list "GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_SECRET" "SESSION_SECRET" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret | quote }}
                  key: {{ $key }}
            {{- end }}
            {{- range $key := list "POSTGRES_USER" "POSTGRES_PASSWORD" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.databaseSecret | quote }}
                  key: {{ $key }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3001
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds
              readOnly: true
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: rds-ca
          configMap:
            name: {{ .Values.rdsCaConfigMap | quote }}
        - name: workspace
          emptyDir:
            sizeLimit: {{ .Values.backend.workspaceSizeLimit }}
