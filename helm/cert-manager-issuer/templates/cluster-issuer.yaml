apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuer.name }}
spec:
  acme:
    email: {{ required "email is required" .Values.email | quote }}
    server: {{ .Values.issuer.server | quote }}
    profile: {{ .Values.issuer.profile | quote }}
    privateKeySecretRef:
      name: {{ .Values.issuer.accountPrivateKeySecretName | quote }}
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.issuer.ingressClassName | quote }}
