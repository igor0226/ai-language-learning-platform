apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api-blocker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-api-blocker
  template:
    metadata:
      labels:
        app: agent-api-blocker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/blocker-configmap.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: nginx
          image: {{ .Values.agentBlocker.image | quote }}
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.agentBlocker.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: agent-api-blocker
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
