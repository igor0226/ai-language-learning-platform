services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-video_streaming}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-video_streaming}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-setup:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-video-streaming}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      exit 0
      "

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      S3_ENDPOINT: http://minio:9000
      POSTGRES_HOST: postgres
      LIVEKIT_API_URL: http://livekit:7880
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      TSC_WATCHFILE: UsePolling
      NODE_ENV: development
    volumes:
      - ./backend:/repo/backend
      - ./packages/contracts:/repo/packages/contracts
      - backend_node_modules:/repo/node_modules
      - backend_pkg_node_modules:/repo/backend/node_modules
      - contracts_node_modules:/repo/packages/contracts/node_modules
      - media_workspace:/tmp/video-streaming-workspace
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      livekit:
        condition: service_started
    command: sh -c "npm run build -w @llp/contracts --prefix /repo && npm run migration:run && npm run start:dev"
    init: true
    tty: true

  livekit-config:
    image: busybox:1.37
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./livekit.yaml:/template/livekit.yaml:ro
      - livekit_rendered:/rendered
    command:
      - sh
      - -c
      - |
        KEY="$${LIVEKIT_API_KEY:-devkey}"
        SECRET="$${LIVEKIT_API_SECRET:-local_livekit_secret_do_not_use_prod}"
        NODE_IP="$${LIVEKIT_NODE_IP:-127.0.0.1}"
        sed -e "s|__LIVEKIT_API_KEY__|$$KEY|g" \
            -e "s|__LIVEKIT_API_SECRET__|$$SECRET|g" \
            -e "s|__LIVEKIT_NODE_IP__|$$NODE_IP|g" \
          /template/livekit.yaml > /rendered/livekit.yaml

  livekit:
    image: livekit/livekit-server:v1.13.6
    command: --config /config/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    volumes:
      - livekit_rendered:/config:ro
    depends_on:
      livekit-config:
        condition: service_completed_successfully

  teacher-agent:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      LIVEKIT_URL: ws://livekit:7880
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    volumes:
      - ./backend:/repo/backend
      - ./packages/contracts:/repo/packages/contracts
      - backend_node_modules:/repo/node_modules
      - backend_pkg_node_modules:/repo/backend/node_modules
      - contracts_node_modules:/repo/packages/contracts/node_modules
    depends_on:
      livekit:
        condition: service_started
    command: sh -c "npm run build -w @llp/contracts --prefix /repo && npm run start:agent:dev"
    init: true
    tty: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    volumes:
      - ./frontend:/repo/frontend
      - ./packages/contracts:/repo/packages/contracts
      - frontend_node_modules:/repo/node_modules
      - frontend_pkg_node_modules:/repo/frontend/node_modules
      - contracts_frontend_node_modules:/repo/packages/contracts/node_modules
      - frontend_next:/repo/frontend/.next
    depends_on:
      - backend
    command: sh -c "npm run build -w @llp/contracts --prefix /repo && npm run dev"
    init: true
    tty: true

volumes:
  backend_node_modules:
  backend_pkg_node_modules:
  contracts_node_modules:
  frontend_node_modules:
  frontend_pkg_node_modules:
  contracts_frontend_node_modules:
  frontend_next:
  postgres_data:
  minio_data:
  media_workspace:
  livekit_rendered:
